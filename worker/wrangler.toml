name = "mindspark-ai-proxy"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Non-secret settings. The API key is NOT here — it is a Worker secret
# (see README.md): `npx wrangler secret put API_KEY`.
[vars]
BASE_URL = "https://openrouter.ai/api/v1"
MODEL = "google/gemma-4-26b-a4b-it:free"
# Comma-separated, tried in order when the previous model errors.
FALLBACK_MODELS = "particle-ai/particle-1:free,recursive/flint-v1.0:free"

[observability]
enabled = true
